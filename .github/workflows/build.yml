name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Take screenshots in the Simulator
        continue-on-error: true
        run: |
          set -x
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for r,l in sorted(d.items(), reverse=True) if 'iOS' in r for x in l if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 1')]; print(ids[0])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Stocked.app
          mkdir -p screenshots
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance $MODE
            for TAB in kitchen list scan; do
              xcrun simctl terminate "$DEVICE" com.payaz.Stocked || true
              xcrun simctl launch --console-pty --terminate-running-process "$DEVICE" com.payaz.Stocked -demoData YES -startTab $TAB > "screenshots/console-$TAB-$MODE.txt" 2>&1 &
              sleep 9
              xcrun simctl io "$DEVICE" screenshot "screenshots/$TAB-$MODE.png"
            done
          done
          xcrun simctl terminate "$DEVICE" com.payaz.Stocked || true
          cp ~/Library/Logs/DiagnosticReports/Stocked*.ips screenshots/ 2>/dev/null || true
          ls -la screenshots

      - name: Save screenshots to the ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
